name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Validate files
        shell: bash
        run: |
          test -f data/StylishTrainerConfig.json || {
            echo "ERROR: data/StylishTrainerConfig.json not found"
            exit 1
          }

          test -f StylishCheatTrainer.lua || {
            echo "ERROR: StylishCheatTrainer.lua not found"
            exit 1
          }

          test -d helpers || {
            echo "ERROR: helpers directory not found"
            exit 1
          }

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p build/reframework/data
          mkdir -p build/reframework/autorun/helpers

          cp data/StylishTrainerConfig.json \
             build/reframework/data/

          cp StylishCheatTrainer.lua \
             build/reframework/autorun/

          cp -r helpers/* \
             build/reframework/autorun/helpers/

      - name: Show package structure
        run: |
          echo "Package contents:"
          find build/reframework -type f

      - name: Create ZIP
        run: |
          cd build
          zip -r "../StylishCheatTrainer-${{ steps.version.outputs.version }}.zip" reframework/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Stylish Cheat Trainer ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: StylishCheatTrainer-${{ steps.version.outputs.version }}.zip